<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>動画の保管庫</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#22262b;--muted:#646b73;--line:#dedcd4;--accent:#b4322a;--accent-ink:#fff;--soft:#f0ece3}
@media (prefers-color-scheme:dark){:root{--bg:#17191c;--surface:#212429;--ink:#eceae5;--muted:#a3a8ae;--line:#383c42;--accent:#e4645a;--accent-ink:#1b1b1b;--soft:#2b2f35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font-size:1.6rem;line-height:1.3}
.count{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.btn{min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
input[type=search],input[type=text],input[type=url],input[type=date],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tools input[type=search]{flex:1 1 260px;width:auto;min-height:44px}
.check{display:flex;gap:8px;align-items:center;min-height:44px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{min-height:36px;padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:.875rem}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:block;width:100%;padding:0;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--soft)}
.card-body{display:block;padding:12px 14px 14px}
.card-title{display:block;font-weight:600;line-height:1.45}
.card-meta{display:block;margin-top:4px;color:var(--muted);font-size:.8rem}
.badge{display:inline-block;margin-top:8px;padding:0 8px;border-radius:4px;background:var(--soft);font-size:.75rem;color:var(--muted)}
.empty{padding:48px 16px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted)}
body:not(.edit) .edit-only{display:none!important}
body.edit .public-only{display:none!important}
footer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
footer p{flex:1 1 280px;margin:0;color:var(--muted);font-size:.85rem}
dialog{width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:20px}
.dlg h2{margin:0 0 16px;font-size:1.2rem;line-height:1.45}
.dlg h3{margin:20px 0 4px;font-size:.9rem;color:var(--muted)}
.field{display:block;margin-bottom:14px;font-weight:600;font-size:.9rem}
.field input,.field textarea{margin-top:4px;font-weight:400;font-size:1rem}
.hint{display:block;margin-top:4px;font-weight:400;font-size:.8rem;color:var(--muted)}
.hint.err{color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:20px}
.actions .left{margin-right:auto}
.player{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.none{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>動画の保管庫</h1><p class="count" id="count"></p></div>
    <button class="btn primary edit-only" id="add" type="button">＋ 動画を追加</button>
  </header>
  <div class="tools">
    <input type="search" id="q" placeholder="タイトル・概要・アウトプットを検索" aria-label="検索">
    <label class="check edit-only"><input type="checkbox" id="todo"> アウトプット未記入のみ</label>
  </div>
  <div class="chips" id="tags"></div>
  <main class="grid" id="list"></main>
  <footer>
    <p class="public-only">良いと思ったYouTube動画と、そこから考えたことの記録です。</p>
    <a class="btn public-only" href="#edit">編集モード</a>
    <p class="edit-only" id="status"></p>
    <button class="btn primary edit-only" id="export" type="button">公開用ファイルを保存</button>
    <button class="btn edit-only" id="import" type="button">ファイルから読み込み</button>
    <button class="btn danger edit-only" id="discard" type="button">下書きを破棄</button>
    <a class="btn edit-only" href="#">公開画面を見る</a>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</div>

<dialog id="form-dlg"><form class="dlg" id="form" novalidate>
  <h2 id="form-title">動画を追加</h2>
  <label class="field">YouTubeのURL<input type="url" id="f-url" placeholder="https://www.youtube.com/watch?v=..."><span class="hint" id="url-hint">貼り付けるとタイトルを自動で入力します</span></label>
  <label class="field">タイトル<input type="text" id="f-title"></label>
  <label class="field">チャンネル名<input type="text" id="f-channel"></label>
  <label class="field">タグ<input type="text" id="f-tags" placeholder="英語, 仕事術"><span class="hint">複数ある場合は「,」か「、」で区切ります</span></label>
  <label class="field">見た日<input type="date" id="f-date"></label>
  <label class="field">概要<textarea id="f-summary" rows="4" placeholder="どんな内容の動画か"></textarea></label>
  <label class="field">自分のアウトプット<textarea id="f-output" rows="6" placeholder="学んだこと、考えたこと、やってみること"></textarea></label>
  <div class="actions"><button class="btn" id="form-cancel" type="button">キャンセル</button><button class="btn primary" type="submit">保存</button></div>
</form></dialog>

<dialog id="view-dlg"><div class="dlg">
  <h2 id="v-title"></h2>
  <iframe class="player" id="v-player" title="動画プレーヤー" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <p class="count" id="v-meta"></p>
  <h3>概要</h3><p class="text" id="v-summary"></p>
  <h3>自分のアウトプット</h3><p class="text" id="v-output"></p>
  <div class="actions">
    <button class="btn danger left edit-only" id="v-delete" type="button">削除</button>
    <a class="btn" id="v-open" target="_blank" rel="noopener">YouTubeで開く</a>
    <button class="btn edit-only" id="v-edit" type="button">編集</button>
    <button class="btn primary" id="v-close" type="button">閉じる</button>
  </div>
</div></dialog>

<script>
const KEY = 'my-navi.videos.v1';
const $ = id => document.getElementById(id);
const state = {q: '', tag: '', todo: false, editing: null, viewing: null};
let videos = [], published = [], editMode = false, loadFailed = false;

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; }
}
async function boot() {
  editMode = location.hash === '#edit';
  document.body.classList.toggle('edit', editMode);
  try {
    const r = await fetch('videos.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (!Array.isArray(data)) throw new Error('format');
    published = data.filter(x => x && /^[\w-]{11}$/.test(x.id || '')).map(normalize);
    loadFailed = false;
  } catch {
    published = [];
    loadFailed = true;
  }
  videos = editMode ? (load() || published) : published;
  render();
}
function isDirty() {
  const key = list => JSON.stringify([...list].sort((a, b) => a.id.localeCompare(b.id)));
  return key(videos) !== key(published);
}
function renderStatus() {
  if (loadFailed) $('status').textContent = '公開中の videos.json を読み込めませんでした。空のまま保存すると公開中の記録を上書きするので注意してください。';
  else if (isDirty()) $('status').textContent = '未公開の変更があります。「公開用ファイルを保存」で videos.json を保存し、GitHubにアップロードすると公開されます。';
  else $('status').textContent = '公開中の内容と同じです。';
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(videos)); return true; }
  catch { alert('保存できませんでした。バックアップを保存してから、ブラウザの設定を確認してください。'); return false; }
}
function parseId(raw) {
  try {
    const u = new URL(raw.trim());
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    let id = '';
    if (host === 'youtu.be') id = u.pathname.split('/')[1];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(shorts|embed|live|v)\/([^/]+)/); if (m) id = m[2]; }
    }
    return /^[\w-]{11}$/.test(id || '') ? id : null;
  } catch { return null; }
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function matches(v) {
  if (state.tag && !v.tags.includes(state.tag)) return false;
  if (state.todo && v.output.trim()) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return [v.title, v.channel, v.summary, v.output, v.tags.join(' ')].join(' ').toLowerCase().includes(q);
}
function render() {
  renderStatus();
  const all = [...new Set(videos.flatMap(v => v.tags))].sort((a, b) => a.localeCompare(b, 'ja'));
  if (state.tag && !all.includes(state.tag)) state.tag = '';
  const chips = $('tags');
  chips.replaceChildren();
  if (all.length) ['', ...all].forEach(t => {
    const c = el('button', 'chip', t || 'すべて');
    c.type = 'button';
    c.setAttribute('aria-pressed', String(state.tag === t));
    c.onclick = () => { state.tag = t; render(); };
    chips.append(c);
  });
  const shown = videos.filter(matches).sort((a, b) => b.addedAt.localeCompare(a.addedAt));
  $('count').textContent = shown.length === videos.length ? `${videos.length}本` : `${videos.length}本中 ${shown.length}本を表示`;
  const list = $('list');
  list.replaceChildren();
  if (!shown.length) {
    const message = videos.length ? '条件に合う動画はありません。'
      : editMode ? 'まだ動画がありません。「＋ 動画を追加」から、良かった動画を保存しましょう。'
      : loadFailed ? '動画を読み込めませんでした。時間をおいて開き直してください。' : 'まだ動画がありません。';
    const e = el('div', 'empty', message);
    e.style.gridColumn = '1 / -1';
    list.append(e);
    return;
  }
  shown.forEach(v => {
    const card = el('button', 'card');
    card.type = 'button';
    const img = el('img');
    img.src = `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`;
    img.alt = '';
    img.loading = 'lazy';
    const body = el('span', 'card-body');
    body.append(el('span', 'card-title', v.title), el('span', 'card-meta', [v.channel, v.watchedOn].filter(Boolean).join(' ・ ')));
    if (editMode && !v.output.trim()) body.append(el('span', 'badge', 'アウトプット未記入'));
    card.append(img, body);
    card.onclick = () => openView(v.id);
    list.append(card);
  });
}
function showText(node, text, fallback) {
  node.textContent = text.trim() || fallback;
  node.classList.toggle('none', !text.trim());
}
function openView(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  state.viewing = id;
  $('v-title').textContent = v.title;
  $('v-player').src = `https://www.youtube-nocookie.com/embed/${v.id}`;
  $('v-meta').textContent = [v.channel, v.watchedOn, v.tags.join('、')].filter(Boolean).join(' ・ ');
  showText($('v-summary'), v.summary, '未記入');
  showText($('v-output'), v.output, '未記入');
  $('v-open').href = `https://www.youtube.com/watch?v=${v.id}`;
  $('view-dlg').showModal();
}
function openForm(v) {
  state.editing = v ? v.id : null;
  $('form-title').textContent = v ? '動画を編集' : '動画を追加';
  $('f-url').value = v ? `https://www.youtube.com/watch?v=${v.id}` : '';
  $('f-url').readOnly = !!v;
  $('f-title').value = v ? v.title : '';
  $('f-channel').value = v ? v.channel : '';
  $('f-tags').value = v ? v.tags.join(', ') : '';
  $('f-date').value = v ? v.watchedOn : new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $('f-summary').value = v ? v.summary : '';
  $('f-output').value = v ? v.output : '';
  hint(v ? 'URLは変更できません' : '貼り付けるとタイトルを自動で入力します');
  $('form-dlg').showModal();
}
function hint(text, err) {
  $('url-hint').textContent = text;
  $('url-hint').classList.toggle('err', !!err);
}
async function autofill() {
  if (state.editing) return;
  const raw = $('f-url').value;
  const id = parseId(raw);
  if (!raw.trim()) return;
  if (!id) return hint('YouTube動画のURLを入力してください', true);
  if (videos.some(v => v.id === id)) return hint('この動画はすでに保存されています', true);
  hint('タイトルを取得しています…');
  try {
    const r = await fetch(`https://www.youtube.com/oembed?format=json&url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (parseId($('f-url').value) !== id) return;
    if (!$('f-title').value) $('f-title').value = d.title || '';
    if (!$('f-channel').value) $('f-channel').value = d.author_name || '';
    hint('タイトルを入力しました');
  } catch {
    hint('タイトルを取得できませんでした。手で入力してください');
  }
}
function normalize(x) {
  return {
    id: x.id,
    title: String(x.title || '(タイトルなし)'),
    channel: String(x.channel || ''),
    tags: Array.isArray(x.tags) ? x.tags.map(String).filter(Boolean) : [],
    watchedOn: String(x.watchedOn || ''),
    summary: String(x.summary || ''),
    output: String(x.output || ''),
    addedAt: String(x.addedAt || new Date().toISOString()),
  };
}

$('add').onclick = () => openForm();
$('q').oninput = e => { state.q = e.target.value; render(); };
$('todo').onchange = e => { state.todo = e.target.checked; render(); };
$('f-url').onchange = autofill;
$('f-url').onpaste = () => setTimeout(autofill);
$('form-cancel').onclick = () => $('form-dlg').close();
$('form').onsubmit = e => {
  e.preventDefault();
  const id = state.editing || parseId($('f-url').value);
  if (!id) { hint('YouTube動画のURLを入力してください', true); $('f-url').focus(); return; }
  if (!state.editing && videos.some(v => v.id === id)) { hint('この動画はすでに保存されています', true); return; }
  const old = videos.find(v => v.id === id);
  const next = normalize({
    id,
    title: $('f-title').value.trim(),
    channel: $('f-channel').value.trim(),
    tags: [...new Set($('f-tags').value.split(/[,、，]/).map(t => t.trim()).filter(Boolean))],
    watchedOn: $('f-date').value,
    summary: $('f-summary').value,
    output: $('f-output').value,
    addedAt: old && old.addedAt,
  });
  videos = old ? videos.map(v => v.id === id ? next : v) : [...videos, next];
  if (!save()) return;
  $('form-dlg').close();
  render();
};
$('view-dlg').addEventListener('close', () => { $('v-player').src = 'about:blank'; });
$('v-close').onclick = () => $('view-dlg').close();
$('v-edit').onclick = () => {
  const v = videos.find(x => x.id === state.viewing);
  $('view-dlg').close();
  openForm(v);
};
$('v-delete').onclick = () => {
  const v = videos.find(x => x.id === state.viewing);
  if (!v || !confirm(`「${v.title}」を削除しますか？`)) return;
  videos = videos.filter(x => x.id !== v.id);
  save();
  $('view-dlg').close();
  render();
};
$('export').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(videos, null, 2)], {type: 'application/json'}));
  const a = el('a');
  a.href = url;
  a.download = 'videos.json';
  a.click();
  URL.revokeObjectURL(url);
};
$('discard').onclick = () => {
  if (!confirm('公開されていない変更を破棄して、公開中の内容に戻しますか？')) return;
  try { localStorage.removeItem(KEY); } catch {}
  boot();
};
$('import').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('format');
    const valid = data.filter(x => x && /^[\w-]{11}$/.test(x.id || '')).map(normalize);
    const ids = new Set(videos.map(v => v.id));
    const fresh = valid.filter(v => !ids.has(v.id));
    videos = [...videos, ...fresh];
    save();
    render();
    alert(`${fresh.length}本を読み込みました（すでにある動画はそのままです）。`);
  } catch {
    alert('このファイルは読み込めませんでした。');
  }
};
window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
